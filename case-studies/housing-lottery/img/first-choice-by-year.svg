<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" role="img" aria-labelledby="t d">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e6e5e0;
        --s1:#2a78d6; --s2:#eb6834; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3936;
          --s1:#3987e5; --s2:#d95926; }
  }
  .bg { fill: var(--surface); }
  .t { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .lab { fill: var(--ink2); font-size: 13px; }
  .val { fill: var(--ink); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink2); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .l1 { stroke: var(--s1); fill: none; stroke-width: 2; }
  .l2 { stroke: var(--s2); fill: none; stroke-width: 2; }
  .d1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .d2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
</style>
<title id="t">Students who got their first-choice hall</title><desc id="d">Average class-year priority versus a pure lottery, by class year. Mean of 1,000 simulated lotteries.</desc><rect class="bg" width="720" height="302" rx="8"/><text class="t" x="24" y="32">Students who got their first-choice hall</text><rect class="s1" x="24" y="48" width="12" height="12" rx="3"/><text class="lab" x="42" y="58">Average class-year priority</text><rect class="s2" x="256.5" y="48" width="12" height="12" rx="3"/><text class="lab" x="274.5" y="58">Pure lottery</text><line class="grid" x1="150.0" x2="150.0" y1="70" y2="272"/><text class="lab" x="150.0" y="290" text-anchor="middle">0%</text><line class="grid" x1="250.0" x2="250.0" y1="70" y2="272"/><text class="lab" x="250.0" y="290" text-anchor="middle">20%</text><line class="grid" x1="350.0" x2="350.0" y1="70" y2="272"/><text class="lab" x="350.0" y="290" text-anchor="middle">40%</text><line class="grid" x1="450.0" x2="450.0" y1="70" y2="272"/><text class="lab" x="450.0" y="290" text-anchor="middle">60%</text><line class="grid" x1="550.0" x2="550.0" y1="70" y2="272"/><text class="lab" x="550.0" y="290" text-anchor="middle">80%</text><line class="grid" x1="650.0" x2="650.0" y1="70" y2="272"/><text class="lab" x="650.0" y="290" text-anchor="middle">100%</text><text class="lab" x="140" y="95.0" text-anchor="end">Senior</text><rect class="s1" x="150" y="76" width="423.8" height="14" rx="3"><title>Senior: 85%</title></rect><text class="val" x="579.8" y="87">85%</text><rect class="s2" x="150" y="92" width="320.4" height="14" rx="3"><title>Senior: 64%</title></rect><text class="val" x="476.4" y="103">64%</text><text class="lab" x="140" y="143.0" text-anchor="end">Junior</text><rect class="s1" x="150" y="124" width="398.2" height="14" rx="3"><title>Junior: 80%</title></rect><text class="val" x="554.2" y="135">80%</text><rect class="s2" x="150" y="140" width="318.5" height="14" rx="3"><title>Junior: 64%</title></rect><text class="val" x="474.5" y="151">64%</text><text class="lab" x="140" y="191.0" text-anchor="end">Sophomore</text><rect class="s1" x="150" y="172" width="279.2" height="14" rx="3"><title>Sophomore: 56%</title></rect><text class="val" x="435.2" y="183">56%</text><rect class="s2" x="150" y="188" width="318.8" height="14" rx="3"><title>Sophomore: 64%</title></rect><text class="val" x="474.8" y="199">64%</text><text class="lab" x="140" y="239.0" text-anchor="end">Freshman</text><rect class="s1" x="150" y="220" width="194.1" height="14" rx="3"><title>Freshman: 39%</title></rect><text class="val" x="350.1" y="231">39%</text><rect class="s2" x="150" y="236" width="317.6" height="14" rx="3"><title>Freshman: 64%</title></rect><text class="val" x="473.6" y="247">64%</text><line class="axis" x1="150" x2="150" y1="70" y2="272"/></svg>
