<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img" aria-labelledby="t d">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e6e5e0;
        --s1:#2a78d6; --s2:#eb6834; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3936;
          --s1:#3987e5; --s2:#d95926; }
  }
  .bg { fill: var(--surface); }
  .t { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .lab { fill: var(--ink2); font-size: 13px; }
  .val { fill: var(--ink); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink2); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .l1 { stroke: var(--s1); fill: none; stroke-width: 2; }
  .l2 { stroke: var(--s2); fill: none; stroke-width: 2; }
  .d1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .d2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
</style>
<title id="t">Gain from grouping with older students (points)</title><desc id="d">First-choice rate of sophomores and freshmen in mixed-year groups minus same-year groups, by priority rule.</desc><rect class="bg" width="720" height="222" rx="8"/><text class="t" x="24" y="32">Gain from grouping with older students (points)</text><line class="grid" x1="150.0" x2="150.0" y1="54" y2="192"/><text class="lab" x="150.0" y="210" text-anchor="middle">-20</text><line class="grid" x1="250.0" x2="250.0" y1="54" y2="192"/><text class="lab" x="250.0" y="210" text-anchor="middle">-10</text><line class="grid" x1="350.0" x2="350.0" y1="54" y2="192"/><text class="lab" x="350.0" y="210" text-anchor="middle">+0</text><line class="grid" x1="450.0" x2="450.0" y1="54" y2="192"/><text class="lab" x="450.0" y="210" text-anchor="middle">+10</text><line class="grid" x1="550.0" x2="550.0" y1="54" y2="192"/><text class="lab" x="550.0" y="210" text-anchor="middle">+20</text><line class="grid" x1="650.0" x2="650.0" y1="54" y2="192"/><text class="lab" x="650.0" y="210" text-anchor="middle">+30</text><text class="lab" x="140" y="74" text-anchor="end">Highest (2023)</text><rect class="s1" x="350.0" y="60" width="279.8" height="18" rx="3"><title>Highest (2023): +28.0 points</title></rect><text class="val" x="635.8" y="74" text-anchor="start">+28.0</text><text class="lab" x="140" y="106" text-anchor="end">Average (2026)</text><rect class="s1" x="350.0" y="92" width="119.1" height="18" rx="3"><title>Average (2026): +11.9 points</title></rect><text class="val" x="475.1" y="106" text-anchor="start">+11.9</text><text class="lab" x="140" y="138" text-anchor="end">Lowest</text><rect class="s1" x="263.3" y="124" width="86.7" height="18" rx="3"><title>Lowest: -8.7 points</title></rect><text class="val" x="257.3" y="138" text-anchor="end">-8.7</text><text class="lab" x="140" y="170" text-anchor="end">Pure lottery</text><rect class="s1" x="302.3" y="156" width="47.7" height="18" rx="3"><title>Pure lottery: -4.8 points</title></rect><text class="val" x="296.3" y="170" text-anchor="end">-4.8</text><line class="axis" x1="350.0" x2="350.0" y1="54" y2="192"/></svg>
